name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
  runs-on: ubuntu-latest

  services:
    postgres:
      image: postgres:16-alpine
      env:
        POSTGRES_USER: peblo
        POSTGRES_PASSWORD: peblo_dev
        POSTGRES_DB: peblo_tv
      ports:
        - 5432:5432
      options: >-
        --health-cmd="pg_isready -U peblo -d peblo_tv"
        --health-interval=5s
        --health-timeout=5s
        --health-retries=5

  steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Run database migrations
      env:
        DATABASE_URL: postgresql+asyncpg://peblo:peblo_dev@localhost:5432/peblo_tv
      run: |
        cd backend
        alembic upgrade head

    - name: Run tests
      env:
        DATABASE_URL: postgresql+asyncpg://peblo:peblo_dev@localhost:5432/peblo_tv
      run: |
        cd backend
        PYTHONPATH=. pytest tests/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install CMS dependencies
        run: |
          cd cms
          npm ci

      - name: Install Viewer dependencies
        run: |
          cd viewer
          npm ci

      - name: Build CMS
        run: |
          cd cms
          npm run build

      - name: Build Viewer
        run: |
          cd viewer
          npm run build

  build-images:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Build API Docker Image
        run: docker build -t peblo-tv-mini-api ./backend

      # Example deployment step placeholder
      # - name: Deploy to Cloudflare R2 / Render
      #   run: ./scripts/deploy.sh
